name: Z3 offline solver regression
on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Z3 Python binding
        run: python -m pip install --no-deps z3-solver==4.13.4.0
      - name: Python syntax
        run: python -m compileall -q tools tests
      - name: Actual Z3 SAT and UNSAT self-check
        run: python -m tools.z3_gate --self-check
      - name: Adversarial regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
